<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="t d">
<title id="t">Build, learn, refine — personal developer principles</title><desc id="d">Three personal themes presented in a premium neon glass interface.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#070b16"/><stop offset="1" stop-color="#111e38"/></linearGradient><linearGradient id="line"><stop stop-color="#247bff"/><stop offset=".5" stop-color="#46d9ff"/><stop offset="1" stop-color="#ff354f"/></linearGradient><style>text{font-family:Arial,Helvetica,sans-serif}.glint{animation:glint 5s ease-in-out infinite}@keyframes glint{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.glint{animation:none}}</style></defs>
<rect width="1200" height="250" rx="24" fill="url(#bg)" stroke="#263e65"/>
<text x="38" y="48" fill="#46d9ff" font-size="15" letter-spacing="3">09  /  THE MINDSET</text><text x="38" y="91" fill="#f4f7ff" font-size="30" font-weight="700">Stay curious. Make it useful. Keep improving.</text>
<g><rect x="38" y="120" width="340" height="92" rx="16" fill="#101e35" stroke="#247bff" stroke-width="1.5"/><circle cx="75" cy="165" r="22" fill="#152d4e" stroke="#247bff" class="glint"/><text x="75" y="170" fill="#f4f7ff" font-size="12" text-anchor="middle">01</text><text x="114" y="158" fill="#247bff" font-size="15" font-weight="700" letter-spacing="2">BUILD</text><text x="114" y="184" fill="#dce7f8" font-size="14">Turn ideas into practical experiments.</text></g><g><rect x="430" y="120" width="340" height="92" rx="16" fill="#101e35" stroke="#46d9ff" stroke-width="1.5"/><circle cx="467" cy="165" r="22" fill="#152d4e" stroke="#46d9ff" class="glint"/><text x="467" y="170" fill="#f4f7ff" font-size="12" text-anchor="middle">02</text><text x="506" y="158" fill="#46d9ff" font-size="15" font-weight="700" letter-spacing="2">LEARN</text><text x="506" y="184" fill="#dce7f8" font-size="14">Stay open to feedback and new tools.</text></g><g><rect x="822" y="120" width="340" height="92" rx="16" fill="#101e35" stroke="#ff354f" stroke-width="1.5"/><circle cx="859" cy="165" r="22" fill="#152d4e" stroke="#ff354f" class="glint"/><text x="859" y="170" fill="#f4f7ff" font-size="12" text-anchor="middle">03</text><text x="898" y="158" fill="#ff354f" font-size="15" font-weight="700" letter-spacing="2">REFINE</text><text x="898" y="184" fill="#dce7f8" font-size="14">Improve the details, not just the demo.</text></g>
<path d="M38 229H1160" stroke="url(#line)" stroke-width="2" opacity=".6"/>
