<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="t d">
<title id="t">How I approach building projects</title><desc id="d">A neon animated workflow from understanding a problem to building and refining a solution.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#070b16"/><stop offset="1" stop-color="#12213d"/></linearGradient><linearGradient id="beam"><stop stop-color="#247bff"/><stop offset=".55" stop-color="#46d9ff"/><stop offset="1" stop-color="#ff354f"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>text{font-family:Arial,Helvetica,sans-serif}.pulse{animation:pulse 2.6s ease-in-out infinite}.p2{animation-delay:.6s}.p3{animation-delay:1.2s}.p4{animation-delay:1.8s}.dash{stroke-dasharray:10 12;animation:dash 16s linear infinite}@keyframes pulse{50%{filter:url(#glow);opacity:.72}}@keyframes dash{to{stroke-dashoffset:-352}}@media(prefers-reduced-motion:reduce){.pulse,.dash{animation:none}}</style></defs>
<rect width="1200" height="310" rx="24" fill="url(#bg)" stroke="#263e65"/>
<text x="38" y="48" fill="#46d9ff" font-size="15" letter-spacing="3">05  /  MY BUILD LOOP</text><text x="38" y="91" fill="#f4f7ff" font-size="31" font-weight="700">From a real problem to a better solution.</text>
<path d="M145 178H1050" stroke="#1d3557" stroke-width="5" stroke-linecap="round"/><path d="M145 178H1050" stroke="url(#beam)" stroke-width="3" class="dash"/>
<g class="pulse "><circle cx="150" cy="178" r="35" fill="#0c1b32" stroke="#247bff" stroke-width="3"/><text x="150" y="184" fill="#f4f7ff" font-size="17" font-weight="700" text-anchor="middle">01</text><text x="150" y="244" fill="#f4f7ff" font-size="21" font-weight="700" text-anchor="middle">Understand</text><text x="150" y="270" fill="#9eafc9" font-size="14" text-anchor="middle">Frame the problem</text></g><g class="pulse p2"><circle cx="450" cy="178" r="35" fill="#0c1b32" stroke="#46d9ff" stroke-width="3"/><text x="450" y="184" fill="#f4f7ff" font-size="17" font-weight="700" text-anchor="middle">02</text><text x="450" y="244" fill="#f4f7ff" font-size="21" font-weight="700" text-anchor="middle">Explore</text><text x="450" y="270" fill="#9eafc9" font-size="14" text-anchor="middle">Research the approach</text></g><g class="pulse p3"><circle cx="750" cy="178" r="35" fill="#0c1b32" stroke="#9c82ff" stroke-width="3"/><text x="750" y="184" fill="#f4f7ff" font-size="17" font-weight="700" text-anchor="middle">03</text><text x="750" y="244" fill="#f4f7ff" font-size="21" font-weight="700" text-anchor="middle">Build</text><text x="750" y="270" fill="#9eafc9" font-size="14" text-anchor="middle">Prototype and test</text></g><g class="pulse p4"><circle cx="1050" cy="178" r="35" fill="#0c1b32" stroke="#ff354f" stroke-width="3"/><text x="1050" y="184" fill="#f4f7ff" font-size="17" font-weight="700" text-anchor="middle">04</text><text x="1050" y="244" fill="#f4f7ff" font-size="21" font-weight="700" text-anchor="middle">Improve</text><text x="1050" y="270" fill="#9eafc9" font-size="14" text-anchor="middle">Learn and iterate</text></g>
</svg>