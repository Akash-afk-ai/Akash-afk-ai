<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
<title id="t">Learning path</title><desc id="d">A continuous animated learning path connecting data, models, applications and deployment.</desc>
<defs><linearGradient id="b"><stop stop-color="#070b16"/><stop offset="1" stop-color="#111e38"/></linearGradient><linearGradient id="l"><stop stop-color="#247bff"/><stop offset=".55" stop-color="#46d9ff"/><stop offset="1" stop-color="#ff354f"/></linearGradient><style>text{font-family:Arial,Helvetica,sans-serif}.traveller{animation:travel 8s linear infinite}.spark{animation:blink 2s ease-in-out infinite}.s2{animation-delay:.6s}.s3{animation-delay:1.2s}@keyframes travel{from{transform:translateX(0)}to{transform:translateX(790px)}}@keyframes blink{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){.traveller,.spark{animation:none}}</style></defs>
<rect width="1200" height="300" rx="24" fill="url(#b)" stroke="#29466e"/><text x="36" y="46" fill="#46d9ff" font-size="14" letter-spacing="3">13 / ALWAYS IN PROGRESS</text><text x="36" y="83" fill="#f4f7ff" font-size="27" font-weight="700">Learn it. Apply it. Make it better.</text>
<path d="M105 185C250 105 350 250 500 170S760 110 900 185s140 35 195-5" fill="none" stroke="#29466e" stroke-width="5"/><path d="M105 185C250 105 350 250 500 170S760 110 900 185s140 35 195-5" fill="none" stroke="url(#l)" stroke-width="3" stroke-dasharray="10 12"/>
<g><circle cx="110" cy="185" r="18" fill="#101f38" stroke="#247bff" stroke-width="3"/><circle class="spark " cx="110" cy="185" r="27" fill="none" stroke="#247bff" stroke-width="2"/><text x="110" y="245" fill="#247bff" font-size="14" text-anchor="middle" font-weight="700">DATA</text><text x="110" y="265" fill="#aab6ce" font-size="12" text-anchor="middle">Find the signal</text></g><g><circle cx="410" cy="194" r="18" fill="#101f38" stroke="#46d9ff" stroke-width="3"/><circle class="spark s2" cx="410" cy="194" r="27" fill="none" stroke="#46d9ff" stroke-width="2"/><text x="410" y="245" fill="#46d9ff" font-size="14" text-anchor="middle" font-weight="700">MODELS</text><text x="410" y="265" fill="#aab6ce" font-size="12" text-anchor="middle">Experiment & learn</text></g><g><circle cx="720" cy="150" r="18" fill="#101f38" stroke="#a58bff" stroke-width="3"/><circle class="spark s3" cx="720" cy="150" r="27" fill="none" stroke="#a58bff" stroke-width="2"/><text x="720" y="245" fill="#a58bff" font-size="14" text-anchor="middle" font-weight="700">APPLICATIONS</text><text x="720" y="265" fill="#aab6ce" font-size="12" text-anchor="middle">Build useful tools</text></g><g><circle cx="1060" cy="180" r="18" fill="#101f38" stroke="#ff536d" stroke-width="3"/><circle class="spark " cx="1060" cy="180" r="27" fill="none" stroke="#ff536d" stroke-width="2"/><text x="1060" y="245" fill="#ff536d" font-size="14" text-anchor="middle" font-weight="700">IMPACT</text><text x="1060" y="265" fill="#aab6ce" font-size="12" text-anchor="middle">Keep improving</text></g>
<circle class="traveller" cx="105" cy="185" r="7" fill="#f4f7ff" filter="url(#glow)"/>
<defs><filter id="glow"><feGaussianBlur stdDeviation="3"/></filter></defs>
</svg>