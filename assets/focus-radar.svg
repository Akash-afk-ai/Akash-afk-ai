<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d">
<title id="t">Interest radar</title><desc id="d">A radar-style visual for artificial intelligence, analytics, software engineering and cloud learning interests.</desc>
<defs><linearGradient id="b"><stop stop-color="#070b16"/><stop offset="1" stop-color="#111e38"/></linearGradient><linearGradient id="s"><stop stop-color="#247bff" stop-opacity="0"/><stop offset="1" stop-color="#46d9ff" stop-opacity=".7"/></linearGradient><style>text{font-family:Arial,Helvetica,sans-serif}.sweep{transform-origin:360px 190px;animation:spin 8s linear infinite}.blip{animation:blip 2.2s ease-in-out infinite}.b2{animation-delay:.7s}.b3{animation-delay:1.4s}@keyframes spin{to{transform:rotate(360deg)}}@keyframes blip{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){.sweep,.blip{animation:none}}</style></defs>
<rect width="1200" height="330" rx="24" fill="url(#b)" stroke="#29466e"/><text x="36" y="45" fill="#46d9ff" font-size="14" letter-spacing="3">15 / INTEREST RADAR</text><text x="36" y="82" fill="#f4f7ff" font-size="27" font-weight="700">Curiosity keeps expanding the map.</text>
<g transform="translate(360 190)" fill="none" stroke="#27446d"><circle r="125"/><circle r="90"/><circle r="55"/><path d="M-140 0H140M0-140V140M-99-99L99 99M-99 99L99-99"/></g>
<path class="sweep" d="M360 190L360 65A125 125 0 0 1 468 127Z" fill="url(#s)" stroke="#46d9ff" stroke-opacity=".5"/>
<circle class="blip" cx="316" cy="116" r="7" fill="#46d9ff"/><circle class="blip b2" cx="443" cy="210" r="7" fill="#ff536d"/><circle class="blip b3" cx="360" cy="70" r="7" fill="#247bff"/>
<g><text x="650" y="133" fill="#46d9ff" font-size="19" font-weight="700">AI &amp; MACHINE LEARNING</text><text x="650" y="158" fill="#aab6ce" font-size="15">Models, experiments and intelligent systems</text><text x="650" y="200" fill="#46d9ff" font-size="19" font-weight="700">DATA SCIENCE &amp; ANALYTICS</text><text x="650" y="225" fill="#aab6ce" font-size="15">Finding patterns and making data useful</text><text x="650" y="267" fill="#ff7185" font-size="19" font-weight="700">SOFTWARE &amp; CLOUD</text><text x="650" y="292" fill="#aab6ce" font-size="15">Building, connecting and shipping projects</text></g>
</svg>