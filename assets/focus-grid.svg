<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="t d">
<title id="t">Explore the work</title><desc id="d">Three neon cards direct visitors to projects, technologies and contact information.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#070b16"/><stop offset="1" stop-color="#111e38"/></linearGradient><linearGradient id="edge"><stop stop-color="#247bff"/><stop offset=".5" stop-color="#46d9ff"/><stop offset="1" stop-color="#ff354f"/></linearGradient><style>text{font-family:Arial,Helvetica,sans-serif}.card{animation:float 4s ease-in-out infinite}.c2{animation-delay:.7s}.c3{animation-delay:1.4s}@keyframes float{50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){.card{animation:none}}</style></defs>
<rect width="1200" height="270" rx="24" fill="url(#bg)" stroke="#263e65"/>
<text x="38" y="48" fill="#46d9ff" font-size="14" letter-spacing="3">11 / EXPLORE THE PROFILE</text><text x="38" y="85" fill="#f4f7ff" font-size="27" font-weight="700">Pick a direction. Dive into the details.</text>
<g class="card "><rect x="38" y="112" width="340" height="122" rx="16" fill="#101f38" stroke="#247bff" stroke-width="2"/><text x="60" y="140" fill="#247bff" font-size="12" letter-spacing="2">01 / DESTINATION</text><text x="60" y="174" fill="#f4f7ff" font-size="21" font-weight="700">PROJECTS</text><text x="60" y="198" fill="#aab6ce" font-size="14">See what I'm building</text><text x="338" y="153" fill="#247bff" font-size="30" text-anchor="middle">↗</text><text x="60" y="220" fill="#247bff" font-size="12">Browse repositories</text></g><g class="card c2"><rect x="430" y="112" width="340" height="122" rx="16" fill="#101f38" stroke="#46d9ff" stroke-width="2"/><text x="452" y="140" fill="#46d9ff" font-size="12" letter-spacing="2">02 / DESTINATION</text><text x="452" y="174" fill="#f4f7ff" font-size="21" font-weight="700">TECH & LEARNING</text><text x="452" y="198" fill="#aab6ce" font-size="14">Explore my technical interests</text><text x="730" y="153" fill="#46d9ff" font-size="30" text-anchor="middle">⌘</text><text x="452" y="220" fill="#46d9ff" font-size="12">Follow the learning path</text></g><g class="card c3"><rect x="822" y="112" width="340" height="122" rx="16" fill="#101f38" stroke="#ff354f" stroke-width="2"/><text x="844" y="140" fill="#ff354f" font-size="12" letter-spacing="2">03 / DESTINATION</text><text x="844" y="174" fill="#f4f7ff" font-size="21" font-weight="700">CONNECT</text><text x="844" y="198" fill="#aab6ce" font-size="14">Have an idea to share?</text><text x="1122" y="153" fill="#ff354f" font-size="30" text-anchor="middle">✦</text><text x="844" y="220" fill="#ff354f" font-size="12">Let's start a conversation</text></g>
</svg>