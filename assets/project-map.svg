<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
<title id="t">Project map</title><desc id="d">A connected map highlighting documented public repositories in parking systems, compliance AI and image steganography.</desc>
<defs><linearGradient id="b"><stop stop-color="#070b16"/><stop offset="1" stop-color="#101e38"/></linearGradient><linearGradient id="p"><stop stop-color="#247bff"/><stop offset=".5" stop-color="#46d9ff"/><stop offset="1" stop-color="#ff354f"/></linearGradient><style>text{font-family:Arial,Helvetica,sans-serif}.route{stroke-dasharray:7 10;animation:route 9s linear infinite}.pin{animation:ping 3s ease-in-out infinite}.p2{animation-delay:1s}.p3{animation-delay:2s}@keyframes route{to{stroke-dashoffset:-340}}@keyframes ping{50%{opacity:.4}}@media(prefers-reduced-motion:reduce){.route,.pin{animation:none}}</style></defs>
<rect width="1200" height="340" rx="24" fill="url(#b)" stroke="#29466e"/><text x="36" y="46" fill="#46d9ff" font-size="14" letter-spacing="3">14 / PROJECT MAP</text><text x="36" y="83" fill="#f4f7ff" font-size="27" font-weight="700">A few coordinates from the public workbench.</text>
<path d="M170 190C350 85 490 260 650 170S900 90 1030 190" fill="none" stroke="#243e65" stroke-width="5"/><path d="M170 190C350 85 490 260 650 170S900 90 1030 190" fill="none" stroke="url(#p)" stroke-width="3" class="route"/>
<g><circle class="pin " cx="170" cy="190" r="28" fill="none" stroke="#46d9ff" stroke-width="2"/><circle cx="170" cy="190" r="12" fill="#46d9ff"/><text x="170" y="245" fill="#46d9ff" font-size="14" font-weight="700" text-anchor="middle">PARKING SYSTEM</text><text x="170" y="269" fill="#f4f7ff" font-size="17" font-weight="700" text-anchor="middle">Bellcorp Parking Lot</text><text x="170" y="292" fill="#aab6ce" font-size="12" text-anchor="middle">React · Node · Databases</text></g><g><circle class="pin p2" cx="650" cy="170" r="28" fill="none" stroke="#a58bff" stroke-width="2"/><circle cx="650" cy="170" r="12" fill="#a58bff"/><text x="650" y="245" fill="#a58bff" font-size="14" font-weight="700" text-anchor="middle">RISK & COMPLIANCE AI</text><text x="650" y="269" fill="#f4f7ff" font-size="17" font-weight="700" text-anchor="middle">TRUST platform</text><text x="650" y="292" fill="#aab6ce" font-size="12" text-anchor="middle">OCR · Knowledge graphs · Gemma AI</text></g><g><circle class="pin p3" cx="1030" cy="190" r="28" fill="none" stroke="#ff536d" stroke-width="2"/><circle cx="1030" cy="190" r="12" fill="#ff536d"/><text x="1030" y="245" fill="#ff536d" font-size="14" font-weight="700" text-anchor="middle">IMAGE STEGANOGRAPHY</text><text x="1030" y="269" fill="#f4f7ff" font-size="17" font-weight="700" text-anchor="middle">ImageSteganographySystem</text><text x="1030" y="292" fill="#aab6ce" font-size="12" text-anchor="middle">Image data hiding</text></g>
</svg>