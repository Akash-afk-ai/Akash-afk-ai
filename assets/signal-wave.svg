<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="t d">
<title id="t">Keep building</title><desc id="d">An animated waveform and neon closing message.</desc>
<defs><linearGradient id="b"><stop stop-color="#070b16"/><stop offset="1" stop-color="#111e38"/></linearGradient><linearGradient id="w"><stop stop-color="#247bff"/><stop offset=".5" stop-color="#46d9ff"/><stop offset="1" stop-color="#ff354f"/></linearGradient><style>text{font-family:Arial,Helvetica,sans-serif}.bar{transform-box:fill-box;transform-origin:center;animation:beat 1.4s ease-in-out infinite}.d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}.d4{animation-delay:.4s}.d5{animation-delay:.5s}.d6{animation-delay:.6s}@keyframes beat{50%{transform:scaleY(.28);opacity:.6}}@media(prefers-reduced-motion:reduce){.bar{animation:none}}</style></defs>
<rect width="1200" height="180" rx="24" fill="url(#b)" stroke="#29466e"/><text x="36" y="56" fill="#46d9ff" font-size="14" letter-spacing="3">16 / KEEP THE SIGNAL ALIVE</text><text x="36" y="103" fill="#f4f7ff" font-size="30" font-weight="700">Stay curious. Keep building.</text><text x="36" y="132" fill="#aab6ce" font-size="15">One idea, one experiment, one better version at a time.</text>
<g transform="translate(750 48)" fill="url(#w)"><rect class="bar " x="0" y="0" width="6" height="20" rx="3"/><rect class="bar d1" x="12" y="5" width="6" height="37" rx="3"/><rect class="bar d2" x="24" y="10" width="6" height="54" rx="3"/><rect class="bar d3" x="36" y="0" width="6" height="71" rx="3"/><rect class="bar d4" x="48" y="5" width="6" height="23" rx="3"/><rect class="bar d5" x="60" y="10" width="6" height="40" rx="3"/><rect class="bar d6" x="72" y="0" width="6" height="57" rx="3"/><rect class="bar " x="84" y="5" width="6" height="74" rx="3"/><rect class="bar d1" x="96" y="10" width="6" height="26" rx="3"/><rect class="bar d2" x="108" y="0" width="6" height="43" rx="3"/><rect class="bar d3" x="120" y="5" width="6" height="60" rx="3"/><rect class="bar d4" x="132" y="10" width="6" height="77" rx="3"/><rect class="bar d5" x="144" y="0" width="6" height="29" rx="3"/><rect class="bar d6" x="156" y="5" width="6" height="46" rx="3"/><rect class="bar " x="168" y="10" width="6" height="63" rx="3"/><rect class="bar d1" x="180" y="0" width="6" height="80" rx="3"/><rect class="bar d2" x="192" y="5" width="6" height="32" rx="3"/><rect class="bar d3" x="204" y="10" width="6" height="49" rx="3"/><rect class="bar d4" x="216" y="0" width="6" height="66" rx="3"/><rect class="bar d5" x="228" y="5" width="6" height="83" rx="3"/><rect class="bar d6" x="240" y="10" width="6" height="35" rx="3"/><rect class="bar " x="252" y="0" width="6" height="52" rx="3"/><rect class="bar d1" x="264" y="5" width="6" height="69" rx="3"/><rect class="bar d2" x="276" y="10" width="6" height="21" rx="3"/><rect class="bar d3" x="288" y="0" width="6" height="38" rx="3"/><rect class="bar d4" x="300" y="5" width="6" height="55" rx="3"/><rect class="bar d5" x="312" y="10" width="6" height="72" rx="3"/><rect class="bar d6" x="324" y="0" width="6" height="24" rx="3"/><rect class="bar " x="336" y="5" width="6" height="41" rx="3"/><rect class="bar d1" x="348" y="10" width="6" height="58" rx="3"/></g>
