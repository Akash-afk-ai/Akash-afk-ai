<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="t d">
<title id="t">From raw problem to useful solution</title><desc id="d">An animated data pipeline illustrating a practical problem-solving workflow.</desc>
<defs><linearGradient id="b"><stop stop-color="#070b16"/><stop offset="1" stop-color="#101e38"/></linearGradient><linearGradient id="g"><stop stop-color="#247bff"/><stop offset=".5" stop-color="#46d9ff"/><stop offset="1" stop-color="#ff354f"/></linearGradient><style>text{font-family:Arial,Helvetica,sans-serif}.flow{stroke-dasharray:9 12;animation:move 4s linear infinite}.node{animation:glow 3s ease-in-out infinite}.n2{animation-delay:.7s}.n3{animation-delay:1.4s}.n4{animation-delay:2.1s}@keyframes move{to{stroke-dashoffset:-84}}@keyframes glow{50%{filter:drop-shadow(0 0 8px #46d9ff)}}@media(prefers-reduced-motion:reduce){.flow,.node{animation:none}}</style></defs>
<rect width="1200" height="270" rx="24" fill="url(#b)" stroke="#29466e"/><text x="36" y="45" fill="#46d9ff" font-size="14" letter-spacing="3">12 / THE BUILD PIPELINE</text><text x="36" y="82" fill="#f4f7ff" font-size="27" font-weight="700">Turn a question into something that works.</text>
<path d="M170 163H1030" stroke="#253d62" stroke-width="5"/><path d="M170 163H1030" stroke="url(#g)" stroke-width="3" class="flow"/>
<g class="node "><circle cx="170" cy="163" r="25" fill="#101f38" stroke="#247bff" stroke-width="3"/><text x="170" y="169" fill="#f4f7ff" font-size="15" font-weight="700" text-anchor="middle">01</text><text x="170" y="120" fill="#247bff" font-size="15" font-weight="700" text-anchor="middle">UNDERSTAND</text><text x="170" y="213" fill="#aab6ce" font-size="14" text-anchor="middle">Define the problem</text></g><g class="node n2"><circle cx="455" cy="163" r="25" fill="#101f38" stroke="#46d9ff" stroke-width="3"/><text x="455" y="169" fill="#f4f7ff" font-size="15" font-weight="700" text-anchor="middle">02</text><text x="455" y="120" fill="#46d9ff" font-size="15" font-weight="700" text-anchor="middle">EXPLORE</text><text x="455" y="213" fill="#aab6ce" font-size="14" text-anchor="middle">Study the data</text></g><g class="node n3"><circle cx="740" cy="163" r="25" fill="#101f38" stroke="#9d7cff" stroke-width="3"/><text x="740" y="169" fill="#f4f7ff" font-size="15" font-weight="700" text-anchor="middle">03</text><text x="740" y="120" fill="#9d7cff" font-size="15" font-weight="700" text-anchor="middle">BUILD</text><text x="740" y="213" fill="#aab6ce" font-size="14" text-anchor="middle">Test an approach</text></g><g class="node n4"><circle cx="1030" cy="163" r="25" fill="#101f38" stroke="#ff536d" stroke-width="3"/><text x="1030" y="169" fill="#f4f7ff" font-size="15" font-weight="700" text-anchor="middle">04</text><text x="1030" y="120" fill="#ff536d" font-size="15" font-weight="700" text-anchor="middle">REFINE</text><text x="1030" y="213" fill="#aab6ce" font-size="14" text-anchor="middle">Improve the result</text></g>
</svg>