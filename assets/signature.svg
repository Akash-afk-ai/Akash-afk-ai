<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="t d">
<title id="t">Akash B Naik — signature</title><desc id="d">A glowing animated closing signature with the words Code, Data, AI and Impact.</desc>
<defs><linearGradient id="bg"><stop stop-color="#070b16"/><stop offset="1" stop-color="#111e38"/></linearGradient><linearGradient id="edge"><stop stop-color="#247bff"/><stop offset=".5" stop-color="#46d9ff"/><stop offset="1" stop-color="#ff354f"/></linearGradient><style>text{font-family:Arial,Helvetica,sans-serif}.wave{animation:wave 2s ease-in-out infinite;transform-origin:center}.w2{animation-delay:.2s}.w3{animation-delay:.4s}.w4{animation-delay:.6s}@keyframes wave{50%{transform:scaleY(.35);opacity:.55}}@media(prefers-reduced-motion:reduce){.wave{animation:none}}</style></defs>
<rect width="1200" height="150" rx="24" fill="url(#bg)" stroke="#29466e"/><rect x="2" y="2" width="1196" height="146" rx="22" fill="none" stroke="url(#edge)" stroke-width="2"/>
<text x="35" y="62" fill="#46d9ff" font-size="14" letter-spacing="3">AKASH B NAIK</text><text x="35" y="101" fill="#f4f7ff" font-size="25" font-weight="700">CODE <tspan fill="#ff354f">•</tspan> DATA <tspan fill="#46d9ff">•</tspan> AI <tspan fill="#ff354f">•</tspan> IMPACT</text>
<g transform="translate(700 42)" fill="url(#edge)"><rect class="wave" x="0" y="22" width="5" height="24" rx="2"/><rect class="wave w2" x="14" y="12" width="5" height="44" rx="2"/><rect class="wave w3" x="28" y="2" width="5" height="64" rx="2"/><rect class="wave w4" x="42" y="17" width="5" height="34" rx="2"/><rect class="wave" x="56" y="26" width="5" height="16" rx="2"/><rect class="wave w2" x="70" y="9" width="5" height="50" rx="2"/></g>
<text x="805" y="64" fill="#dce7f8" font-size="20" font-style="italic">“Turning ideas into</text><text x="805" y="94" fill="#46d9ff" font-size="20" font-style="italic">intelligent solutions.”</text>
<text x="805" y="122" fill="#7f91ad" font-size="12">DAVANAGERE · KARNATAKA · INDIA</text>
</svg>